name: Test run
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,15 * *'
  push:
    branches:
      - master
      - playground-*
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nodeVersion: [20, 22, 24]
        puppeteerVersion: [22, 23, 24, latest]
        toughCookieVersion: [4, 5, 6]
      fail-fast: false
    name: Puppeteer ${{ matrix.puppeteerVersion }}, tough-cookie ${{ matrix.toughCookieVersion }}, Node.js ${{ matrix.nodeVersion }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: "Install"
        run: npm install --no-save
              puppeteer@${{ matrix.puppeteerVersion }}
              tough-cookie@${{ matrix.toughCookieVersion }}
              ${{ matrix.toughCookieVersion == 4 && '@types/tough-cookie@4' || '' }}
      - name: "Build"
        run: npm run build
      - name: "Test"
        run: npm run test
